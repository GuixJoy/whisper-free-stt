[package]
name = "stt-ui"
version = "0.1.0"
description = "Local-first dictation: transcribes speech on your machine and types it into the focused window."
authors = ["Akshat Kotpalliwar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stt_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
dirs-next = "2"
thiserror = "2"
sherpa-onnx = "1.13"
cpal = "0.18"
# These four were previously declared under
# [target.'cfg(target_os = "linux")'.dependencies], but they are not
# Linux-specific: models.rs uses reqwest/tar/bzip2 unconditionally for model
# downloads and .tar.bz2 extraction, and anyhow::Result is used across the
# crate (11 files). Declaring them Linux-only meant the crate had 52
# unresolved-crate errors on Windows and macOS, so those targets had never
# compiled and no release had ever produced an installer for them.
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
anyhow = "1"
bzip2 = "0.4"
tar = "0.4"
# default-features must stay off: llama-cpp-4's defaults include
# `dynamic-link`, which builds libllama/libggml as SHARED libraries. Tauri's
# bundler does not ship them, so the installed .deb/.rpm failed to start with
# "libllama.so.0: cannot open shared object file". Static linking gives one
# self-contained binary that runs anywhere.
llama-cpp-4 = { version = "0.6", default-features = false, features = ["openmp", "mtmd"] }

[features]
# GPU offload for the local LLM. Opt-in: building it needs a Vulkan toolchain
# (glslc + SPIRV-Headers) at build time, which is why the default build stays
# CPU-only and needs no Vulkan SDK.
#   pnpm tauri build -- --features vulkan
vulkan = ["llama-cpp-4/vulkan"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = "s"
strip = true

