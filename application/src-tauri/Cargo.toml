[package]
name = "stt-ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stt_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
dirs-next = "2"
thiserror = "2"
sherpa-onnx = "1.13"
cpal = "0.18"
llama-cpp-4 = "0.6"

# GPU offload (Vulkan) is built on Linux only, where the CI/release
# runners and dev machines can provision glslc + SPIRV-Headers.
# Windows/macOS fall back to CPU inference.
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-4 = { version = "0.6", features = ["vulkan"] }
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
anyhow = "1"
bzip2 = "0.4"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = "s"
strip = true

