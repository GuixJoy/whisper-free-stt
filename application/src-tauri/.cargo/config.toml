# No hardcoded target — Cargo auto-detects host platform.
# Build with: pnpm tauri build
#
# The default build links llama.cpp statically with CPU inference, so it needs
# no Vulkan toolchain. The GPU backend is opt-in:
#     pnpm tauri build -- --features vulkan
# which additionally needs glslc + SPIRV-Headers at build time. Those are
# machine-local (no sudo required); do NOT commit absolute include paths here —
# local shells use $CARGO_HOME/config.toml or exported CPLUS_INCLUDE_PATH.
