name: Release

on:
  # Any version tag, pushed by hand or by another tool.
  push:
    tags:
      - "v*"
    # Keyword-gated builds. GitHub cannot filter `on.push` by commit message,
    # so every push to master starts this workflow and the `if` on
    # resolve-release decides whether anything actually runs. A skipped run
    # costs seconds, not build minutes.
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

# Two runs must never race on the same release — both would try to upload the
# same assets. Not cancel-in-progress: a cancelled release mid-build is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Release
    # Runs for: tag pushes, manual dispatch, and pushes to master whose head
    # commit message STARTS with `release v<version>`, e.g.
    #
    #     git commit -m "release v0.2.0"
    #     git push origin master
    #
    # startsWith, not contains. head_commit.message is the whole message
    # including the body, so a commit that merely *documents* the convention --
    # a usage example in the body -- fired a release on this workflow's own
    # first push. The gate is anchored to the start of the message, and the
    # script below reads only the subject line. Consequence: a prefix such as
    # "chore: release v0.2.0" does not trigger; the message must begin with it.
    #
    # The keyword must be in the last commit of the push: head_commit is the
    # only commit message available to an `if` expression.
    if: |
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release v'))
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
          fetch-depth: 0

      - name: Resolve tag and release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script:
          # a commit message is attacker-influenced text and `${{ }}` inside a
          # `run:` block would execute any `$(...)` in it.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"                          # manual dispatch
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"            # tag push
          else
            # Keyword push. Read the subject line only, and capture only the
            # version, so no other part of the message can reach the shell or
            # the API.
            SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -1)
            VERSION=$(printf '%s' "$SUBJECT" \
              | grep -oE '^release v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' \
              | sed 's/^release v//')
            if [ -z "$VERSION" ]; then
              echo "::error::$(git rev-parse --short HEAD) has no 'release v<version>' keyword"
              exit 1
            fi
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # Creating the release also creates the tag, via the API. That is
          # deliberate: an event produced with GITHUB_TOKEN does not start
          # another workflow run, so this cannot re-trigger the `tags: v*`
          # path above and race itself. Swapping in a PAT *would* double-fire.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.id')
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04, not latest/24.04, for glibc 2.35: a binary built
          # against 2.39 will not start on Debian 12 or Ubuntu 22.04. The image
          # entered deprecation on 2026-09-17 and is removed 2027-04-17, with
          # brownout windows that fail this job intermittently in between.
          # Moving up means dropping support for older distros.
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            target: "x86_64-pc-windows-msvc"
          # macOS is deliberately not built. The .dmg is unsigned (no Apple
          # Developer account), so Gatekeeper blocks it on a clean machine, and
          # macOS runners bill at 10x. To reinstate, add macos-latest
          # (aarch64) and macos-15-intel (x86_64; macos-13 was retired
          # 2025-12-04), and put **/*.dmg back in the upload paths below.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}

      - name: Stamp the release version
        shell: bash
        working-directory: application/src-tauri
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          # The tag is the source of truth. Without this the bundles carry
          # whatever version happens to be committed, which is how a v0.2.0
          # release ends up shipping 0.1.0 installers.
          #
          # `sed -i.bak` behaves the same on GNU sed (Linux) and the GNU sed in
          # Git Bash (Windows), and would still be correct if the macOS job is
          # reinstated. Both files have exactly one version line, so no section
          # scoping is needed.
          sed -i.bak -E "s/^  \"version\": \"[^\"]+\",/  \"version\": \"$VERSION\",/" tauri.conf.json
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" Cargo.toml
          rm -f tauri.conf.json.bak Cargo.toml.bak
          grep -m1 '"version"' tauri.conf.json
          grep -m1 '^version = ' Cargo.toml

      # pnpm must exist before setup-node. setup-node's `cache: pnpm` resolves
      # the store path by running `pnpm store path`, and fails with "Unable to
      # locate executable file: pnpm" when pnpm is not on PATH yet. ci.yml
      # already had this order; release.yml had it inverted, so this job had
      # never once got past Setup Node.js.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: application/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri's Linux build deps (webkit2gtk 4.1, tray, rsvg) plus the
          # app's own: ALSA for cpal and dbus.
          #
          # No Vulkan SDK / glslc / SPIRV-Headers: the llama.cpp Vulkan backend
          # is opt-in (`--features vulkan`), so the default build needs no
          # Vulkan toolchain and produces a single static binary.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: application
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floure-${{ matrix.platform }}
          path: |
            application/src-tauri/target/release/bundle/**/*.exe
            application/src-tauri/target/release/bundle/**/*.AppImage
            application/src-tauri/target/release/bundle/**/*.deb
            application/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn
